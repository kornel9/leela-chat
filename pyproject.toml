[project]
name = "leela-chat"
version = "0.0.0"
description = "Conversational interface to Leela Chess Zero — extract signals from Lc0's MCTS tree and network internals, translate to prose via a frontier LLM."
requires-python = "==3.11.*"
dependencies = [
    # Pinned to +cpu local-version variants. The plain "2.12.0" wheel on the
    # CPU index is actually the CUDA build (PEP 440 treats `2.12.0` and
    # `2.12.0+cpu` as equal, so without the explicit local qualifier uv may
    # pick the CUDA wheel → torchvision::nms missing at import time).
    "torch==2.12.0+cpu",
    "torchvision==0.27.0+cpu",
    "python-chess>=1.999,<2.0",
    "lczerolens[hf]>=0.4.0,<0.5",
    "loguru>=0.7,<0.8",
    "pydantic>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<0.30",
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.0,<2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# CPU-only torch wheels — this laptop will never have a GPU.
# Remote GPU machine will override this index when it gets a venv.
# torchvision is pinned to the same index so its compiled ops (nms, etc.) match
# torch's ABI — otherwise onnx2torch (lczerolens dep) fails at import time.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
