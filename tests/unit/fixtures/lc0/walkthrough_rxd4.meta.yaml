# Walkthrough Rxd4 — divergent-timescale fixture (A1)
#
# Captured 2026-05-19 on pod (BT4 + Lc0 v0.32.1, cuda-fp16). Per the
# Chunk 6a v2 reviewer pass A1, the dual-timescale `did_you_consider`
# handler needs a fixture covering the divergent quadrants where
# network signal and MCTS signal disagree. The Rxd4 walkthrough
# position covers BOTH divergent quadrants in a single position — see
# the per-focal-move analysis below.
#
# Companion files:
#   walkthrough_rxd4.txt              — single end-of-search snapshot (Chunk 2 fixture, parser tests)
#   walkthrough_rxd4_livestats.txt    — multi-block live-stats stream (Chunk 6a v2 trajectory tests)

position:
  fen: "1r1r2k1/5ppp/p3pn2/4q3/b1PN4/Q4P2/P2RB1PP/KR6 b - - 0 1"
  side_to_move: black
  description: |
    Black-to-move tactical position. Two candidate moves of interest:
    - Rxd4 (d8d4): wins material via a quiet rook capture; refutes
      White's knight on d4. Stockfish-top-1 at depth 20+.
    - Rxb1+ (b8b1): an attractive-looking attack the network ranks
      highly but search refutes (Kxb1 holds).

  stockfish_depth_20_top_pv:
    bestmove_uci: d8d4
    bestmove_san: Rxd4
    pv_san: [Rxd4, Rxd4, Qxa3]   # Rxd4 cxd4 (only legal recapture), Qxa3
    eval_cp: -310  # from white's perspective; black is winning

mcts_findings:
  # Empirical from Lc0 v0.32.1 (cuda-fp16) at nodes=10000.
  bestmove_uci: d8d4
  bestmove_san: Rxd4
  rxd4_visit_share_at_10k: 0.84   # roughly 8400 / 10000

# === A1 coverage: dual divergent quadrants in this position ===

divergent_quadrants:
  # Quadrant 2: network keeps, search refutes.
  search_refutes:
    focal_uci: b8b1
    focal_san: "Rxb1+"
    description: |
      Rxb1+ is the network's eventual top-1 (rank 1 at the final BT4
      layer, ~27% policy). The network commits LATE — rank 41 at
      L=0, stays in 30-50s through L=13, rank 2 at L=14, rank 1 at
      L=15. Within MCTS, Q dips from V-head optimism (+0.74) to a
      trough (+0.36 at v=28) as search finds the Kxb1 defense;
      partial drift back to ~+0.53 by deepest live-stats emit
      (v=89). The drift is "search no longer sampling" (PUCT
      redirected visits to Rxd4), NOT "the move recovering."
    network_emergence_pattern: "Late emergence: rank 41→1 with the commitment at L=14-15"
    expected_summary:
      q_first_approx: 0.74
      q_trough_approx: 0.36
      q_trough_at_visits_approx: 28
      visit_share_approx: 0.02   # ~2% of root visits — search refused to commit
      trajectory_pattern: "high V-head; trough at v~28 (refutation); post-trough drift to +0.53 as PUCT redirected"

  # Quadrant 3: network ranks low throughout, MCTS rescues.
  mcts_rescue:
    focal_uci: d8d4
    focal_san: "Rxd4"
    description: |
      Rxd4 is the MCTS bestmove (~91% visit share at the deepest
      live-stats emit). The network NEVER finds this move — rank
      stays >= 9 at every BT4 layer (peak rank 9 at L=15). The
      network's pattern recognition doesn't suggest this move at any
      layer of computation; discovery is a search artifact. This is
      the canonical divergent-timescale fixture for the
      `did_you_consider` handler's network-low/MCTS-rescue worked
      example.
    network_emergence_pattern: "Never_rose: rank 43→9; never enters top-5 at any layer"
    expected_summary:
      q_first_approx: 0.56     # V-head only (no visits at first emit)
      q_peak_approx: 0.95
      q_peak_at_visits_approx: 88
      q_last_approx: 0.92
      visit_share_approx: 0.91   # ~91% of root visits — search committed strongly
      trajectory_pattern: "V-head start; rapid climb after first visits; sustained high Q"

  # Quadrant 4 (added in Chunk 6b.5 measurement, 2026-05-19): both
  # signals dismiss (concordant dismissal of a non-engine-pick).
  concordant_dismissal:
    focal_uci: e5g5
    focal_san: "Qg5"
    description: |
      Qg5 is the network's L=0 embedding-only favorite (rank 1 at
      L=0; the only place the BT4 embedding alone prefers this move).
      Later layers progressively demote it: rank 27 at L=1, then 43,
      then drifts back through the 30s before dropping to rank 7 at
      L=15. MCTS independently demotes it — visit share 0.46%
      (21 of 4592 visits at the deepest live-stats emit), Q stays
      modest (~+0.58 to +0.68, never developing). Both signals dismiss
      Qg5, by independent routes: the network does it via late-layer
      rank drop; search does it via not allocating visits.
    network_emergence_pattern: "L=0 top-1 → L=15 rank 7; rose_and_stayed-but-faded"
    expected_summary:
      q_first_approx: 0.56     # V-head baseline
      q_peak_approx: 0.68
      q_peak_at_visits_approx: 20
      q_last_approx: 0.64
      visit_share_approx: 0.005   # well under 5% — concordant dismissal signature
      trajectory_pattern: "stays near V-head baseline; never develops a meaningful Q profile"

